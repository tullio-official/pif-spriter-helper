# weekly palette rebuild + site publishing
name: site

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # palettes
      - if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pif-palettes
          key: palettes-${{ github.run_id }}
          restore-keys: palettes-
      - if: github.event_name != 'push'
        env:
          PALETTE_CACHE: ~/.cache/pif-palettes
        run: |
          pip install requests pillow numpy
          python build/palettes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update palettes" && git push)

      # site publishing
      - run: |
          mkdir -p site/data/palettes
          cp -r index.html home.css home.js news.js shared assets palette-library unsprited-finder site/
          cp data/counts.js site/data/
          cp data/palettes/*.js site/data/palettes/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
